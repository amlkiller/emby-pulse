name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'ENV APP_VERSION=\K[^\s]+' Dockerfile)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag_suffix=beta" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            amlkiller/embypulse-pro:${{ steps.version.outputs.tag_suffix }}
            zeyu8023/embypulse-pro:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max