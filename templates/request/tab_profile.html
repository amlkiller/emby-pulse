<div class="w-full pb-6">
    
    <div x-show="isStatsLoading" class="flex flex-col items-center justify-center py-20 gap-4">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
        <div class="text-sm text-slate-500 dark:text-slate-400">正在加载观影数据...</div>
    </div>
    
    <div x-show="!isStatsLoading">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">
            <div class="lg:col-span-2 glass-panel p-6 sm:p-8 rounded-3xl flex flex-col items-center justify-center gap-3 relative overflow-hidden text-center border-t border-white/40 dark:border-white/5 shadow-lg"
                 x-data="{
                    avatarUploading: false, avatarMsg: '',
                    pwModalOpen: false, oldPw: '', newPw: '', confirmPw: '', pwMsg: '', pwLoading: false,
                    async uploadAvatar(e) {
                        const file = e.target.files[0];
                        if (!file) return;
                        if (file.size > 10*1024*1024) { this.avatarMsg = '图片不能超过 10MB'; return; }
                        this.avatarUploading = true; this.avatarMsg = '';
                        const fd = new FormData(); fd.append('file', file);
                        try {
                            const res = await fetch('/api/user/avatar', { method: 'POST', body: fd });
                            const d = await res.json();
                            this.avatarMsg = d.message || '操作完成';
                            if (d.status === 'success') {
                                document.querySelector('.profile-avatar-img').src = '/api/proxy/user_image/' + userId + '?t=' + Date.now();
                            }
                        } catch(_) { this.avatarMsg = '网络异常'; }
                        this.avatarUploading = false; e.target.value = '';
                    },
                    async changePw() {
                        this.pwMsg = '';
                        if (!this.oldPw) { this.pwMsg = '请输入旧密码'; return; }
                        if (this.newPw.length < 4) { this.pwMsg = '新密码至少 4 位'; return; }
                        if (this.newPw !== this.confirmPw) { this.pwMsg = '两次密码不一致'; return; }
                        this.pwLoading = true;
                        try {
                            const res = await fetch('/api/user/password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({old_password: this.oldPw, new_password: this.newPw}) });
                            const d = await res.json();
                            this.pwMsg = d.message || '操作完成';
                            if (d.status === 'success') { this.oldPw=''; this.newPw=''; this.confirmPw=''; setTimeout(() => this.pwModalOpen = false, 1500); }
                        } catch(_) { this.pwMsg = '网络异常'; }
                        this.pwLoading = false;
                    }
                 }">
                <div class="absolute inset-0 bg-gradient-to-b from-brand-500/5 to-transparent z-0"></div>
                <!-- 头像（点击上传）+ 修改密码小按钮 -->
                <div class="relative z-10">
                    <div class="relative group cursor-pointer" @click="$refs.avatarInput.click()">
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full shadow-xl overflow-hidden shrink-0 bg-slate-200 ring-4 ring-white dark:ring-[#0f0f0f]">
                            <img :src="'/api/proxy/user_image/' + userId" class="w-full h-full object-cover profile-avatar-img" @error="$event.target.src='https://api.dicebear.com/9.x/notionists/png?seed=' + (userId || 'User')">
                        </div>
                        <div class="absolute inset-0 rounded-full bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-camera text-white text-lg" x-show="!avatarUploading"></i>
                            <i class="fa-solid fa-spinner fa-spin text-white text-lg" x-show="avatarUploading"></i>
                        </div>
                        <input type="file" accept="image/*" x-ref="avatarInput" class="hidden" @change="uploadAvatar($event)">
                    </div>
                    <!-- 修改密码：头像右下角小圆形按钮 -->
                    <button @click.stop="pwModalOpen = true" class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-white dark:bg-[#2C2C2E] border-2 border-white dark:border-[#0f0f0f] shadow-md flex items-center justify-center hover:bg-slate-100 dark:hover:bg-[#3A3A3C] transition-colors" title="修改密码">
                        <i class="fa-solid fa-key text-[10px] text-slate-400"></i>
                    </button>
                </div>
                <p x-show="avatarMsg" x-text="avatarMsg" class="text-[11px] z-10" :class="avatarMsg.includes('已更新') ? 'text-emerald-500' : 'text-rose-500'"></p>
                <div class="z-10 mt-1">
                    <h3 class="text-2xl font-black text-slate-900 dark:text-white flex items-center justify-center gap-2">
                        <span x-text="userName"></span><i class="fa-solid fa-circle-check text-brand-500 text-sm"></i>
                    </h3>
                    <div class="mt-2 space-y-1">
                        <div class="text-[10px] font-bold text-slate-500 bg-slate-100 dark:bg-white/5 px-2 py-0.5 rounded inline-block">入驻天数：<span x-text="userStats?.overview?.account_age_days || 1"></span> 天</div>
                        <div class="text-[10px] font-bold text-slate-500 bg-slate-100 dark:bg-white/5 px-2 py-0.5 rounded inline-block">账号有效期：<span x-text="expireDate" :class="(expireDate === '永久有效' || expireDate.includes('2099') || expireDate.includes('3000')) ? 'text-brand-500' : 'text-rose-500'"></span></div>
                    </div>
                    <!-- 续费码输入 -->
                    <div class="mt-3 w-full max-w-xs mx-auto" x-data="{renewCode:'', renewMsg:'', renewLoading:false}">
                        <div class="flex gap-2">
                            <input type="text" x-model="renewCode" placeholder="输入续费码" autocomplete="off" class="flex-1 px-3 py-2 rounded-xl bg-slate-100 dark:bg-white/5 border border-transparent dark:border-white/5 text-[12px] text-center font-mono outline-none focus:ring-2 focus:ring-brand-500">
                            <button @click="renewLoading=true; renewMsg=''; fetch('/api/user/renew',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:renewCode})}).then(r=>r.json()).then(d=>{renewLoading=false;renewMsg=d.message||'操作完成';if(d.status==='success'){setTimeout(()=>window.location.reload(),1500)}}).catch(()=>{renewLoading=false;renewMsg='网络异常'})" :disabled="renewLoading || !renewCode.trim()" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-[12px] font-bold shadow-sm active:scale-95 transition-all disabled:opacity-50 shrink-0">
                                <span x-show="!renewLoading">续期</span>
                                <i x-show="renewLoading" class="fa-solid fa-spinner fa-spin"></i>
                            </button>
                        </div>
                        <p x-show="renewMsg" x-text="renewMsg" class="text-[11px] mt-1.5 text-center" :class="renewMsg.includes('成功') ? 'text-emerald-500' : 'text-rose-500'"></p>
                    </div>
                </div>

                <!-- 修改密码 Modal -->
                <template x-teleport="body">
                    <div x-show="pwModalOpen" class="fixed inset-0 z-[200] flex items-center justify-center p-4" x-cloak>
                        <div x-show="pwModalOpen" x-transition.opacity @click="pwModalOpen = false" class="absolute inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm"></div>
                        <div x-show="pwModalOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="relative w-full max-w-sm bg-white dark:bg-[#1C1C1E] rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-white/10">
                            <h3 class="text-[16px] font-black text-slate-800 dark:text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-key text-brand-500"></i> 修改密码</h3>
                            <div class="space-y-3">
                                <input type="password" x-model="oldPw" placeholder="当前密码" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-white/5 border border-transparent dark:border-white/5 text-[13px] outline-none focus:ring-2 focus:ring-brand-500">
                                <input type="password" x-model="newPw" placeholder="新密码（至少 4 位）" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-white/5 border border-transparent dark:border-white/5 text-[13px] outline-none focus:ring-2 focus:ring-brand-500">
                                <input type="password" x-model="confirmPw" placeholder="确认新密码" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-white/5 border border-transparent dark:border-white/5 text-[13px] outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <p x-show="pwMsg" x-text="pwMsg" class="text-[12px] mt-3 text-center" :class="pwMsg.includes('已修改') ? 'text-emerald-500' : 'text-rose-500'"></p>
                            <div class="flex gap-3 mt-4">
                                <button @click="pwModalOpen = false; pwMsg=''" class="flex-1 py-2.5 rounded-xl text-[13px] font-bold text-slate-500 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">取消</button>
                                <button @click="changePw()" :disabled="pwLoading" class="flex-1 py-2.5 rounded-xl text-[13px] font-bold text-white bg-brand-500 hover:bg-brand-600 transition-colors shadow-sm disabled:opacity-50">
                                    <span x-show="!pwLoading">确认修改</span>
                                    <i x-show="pwLoading" class="fa-solid fa-spinner fa-spin"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <div x-init="initPoints()" class="w-full mt-4 flex flex-col gap-3 z-10 relative">
                    
                    <div class="absolute right-4 -top-3 z-20 pointer-events-none flex flex-col items-center">
                        <div x-show="!hasCheckedIn && !isLoadingPoints && !showRewardBubble"
                             x-transition.opacity
                             class="bg-rose-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-lg shadow-rose-500/40 animate-bounce whitespace-nowrap relative">
                            点我抽盲盒!
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-rose-500 rotate-45"></div>
                        </div>

                        <div x-show="showRewardBubble"
                             x-transition:enter="transition ease-out duration-300"
                             x-transition:enter-start="opacity-0 translate-y-4 scale-50"
                             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                             x-transition:leave="transition ease-in duration-500"
                             x-transition:leave-start="opacity-100 translate-y-0"
                             x-transition:leave-end="opacity-0 -translate-y-6 scale-110"
                             class="bg-emerald-500 text-white text-[12px] font-black px-3 py-1 rounded-full shadow-lg shadow-emerald-500/40 whitespace-nowrap relative">
                            <i class="fa-solid fa-coins mr-1"></i> +<span x-text="checkinReward"></span> 积分
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-emerald-500 rotate-45"></div>
                        </div>
                    </div>

                    <div @click="storeModalOpen = true" class="bg-gradient-to-br from-amber-400 to-orange-500 rounded-[20px] p-5 text-white shadow-[0_8px_30px_rgba(245,158,11,0.25)] relative overflow-hidden text-left flex justify-between items-center border border-white/20 dark:border-white/10 cursor-pointer hover:scale-[1.02] transition-transform group">
                        <i class="fa-solid fa-coins absolute -right-2 -bottom-4 text-7xl opacity-20 group-hover:rotate-12 transition-transform duration-500"></i>
                        <div class="relative z-10">
                            <div class="text-[10px] font-black tracking-widest uppercase opacity-90 mb-0.5 drop-shadow-sm flex items-center gap-1">我的可用资产 <i class="fa-solid fa-chevron-right text-[8px] opacity-70"></i></div>
                            <div class="text-3xl font-black font-mono drop-shadow-md flex items-baseline gap-1">
                                <span x-text="isLoadingPoints ? '...' : points"></span>
                                <span class="text-xs font-bold opacity-80">Pts</span>
                            </div>
                        </div>
                        <div class="relative z-10">
                            <button @click.stop="checkIn($event)" :disabled="hasCheckedIn || isCheckingIn" 
                                    class="px-4 py-2.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl font-bold text-xs border border-white/40 transition-all shadow-sm disabled:opacity-80 disabled:cursor-not-allowed flex items-center gap-1.5" 
                                    :class="!hasCheckedIn ? 'animate-pulse ring-2 ring-white/50 ring-offset-2 ring-offset-orange-400' : 'opacity-80 bg-white/10 border-transparent'">
                                <i class="fa-solid" :class="hasCheckedIn ? 'fa-check-circle text-green-300' : 'fa-gift'"></i>
                                <span x-text="hasCheckedIn ? '今日已签' : '签到盲盒'"></span>
                            </button>
                        </div>
                    </div>

                    <template x-teleport="body">
                        <div x-show="storeModalOpen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 text-left" x-cloak>
                            <div x-show="storeModalOpen" x-transition.opacity @click="storeModalOpen = false" class="absolute inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm"></div>
                            <div x-show="storeModalOpen" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-10 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" class="relative w-full max-w-[450px] bg-white dark:bg-[#111] border border-slate-200 dark:border-white/5 rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
                                <div class="p-5 sm:p-6 border-b border-slate-100 dark:border-white/5 flex justify-between items-center shrink-0 bg-slate-50/50 dark:bg-white/5">
                                    <h3 class="text-lg font-black text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-store text-brand-500"></i> 积分补给站</h3>
                                    <button @click="storeModalOpen = false" class="w-8 h-8 rounded-full bg-slate-200/50 dark:bg-white/10 text-slate-500 hover:text-rose-500 flex justify-center items-center transition-colors"><i class="fa-solid fa-xmark text-sm"></i></button>
                                </div>
                                <div class="p-5 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-500/10 dark:to-orange-500/10 shrink-0 flex justify-between items-center">
                                    <div>
                                        <div class="text-[10px] font-bold text-amber-600 dark:text-amber-500 uppercase tracking-widest mb-0.5">当前余额</div>
                                        <div class="text-2xl font-black font-mono text-amber-700 dark:text-amber-400" x-text="points + ' Pts'"></div>
                                    </div>
                                    <button @click="showMyLogs = true; loadMyLogs()" x-show="!showMyLogs" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-700 dark:text-amber-500 font-bold px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5"><i class="fa-solid fa-list-ul"></i> 资产明细</button>
                                    <i class="fa-solid fa-piggy-bank text-4xl text-amber-500/30" x-show="showMyLogs"></i>
                                </div>
                                <div class="p-4 sm:p-5 overflow-y-auto flex-1 bg-slate-50 dark:bg-[#0a0a0a]">
                                    
                                    <div x-show="!showMyLogs" class="space-y-3">
                                        <template x-for="item in (config?.store_items || [])" :key="item.id">
                                            <div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 rounded-[18px] p-4 flex items-center justify-between shadow-sm hover:shadow-md hover:border-brand-300 dark:hover:border-brand-500/50 transition-all group" :class="item.type === 'random_renew' ? 'ring-2 ring-purple-200 dark:ring-purple-500/30' : ''">
                                                <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                                    <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 shadow-inner" :class="item.type === 'random_renew' ? 'bg-purple-100 dark:bg-purple-500/20' : (item.type === 'renew' ? 'bg-emerald-100 dark:bg-emerald-500/20' : 'bg-amber-100 dark:bg-amber-500/20')">
                                                        <i class="fa-solid text-lg" :class="item.type === 'random_renew' ? 'fa-dice text-purple-500' : (item.type === 'renew' ? 'fa-battery-half text-emerald-500' : 'fa-ticket text-amber-500')"></i>
                                                    </div>
                                                    <div class="flex-1 min-w-0 pr-2">
                                                        <div class="text-[14px] font-black text-slate-800 dark:text-zinc-200 truncate flex items-center gap-1.5">
                                                            <span x-text="item.name"></span>
                                                            <span x-show="item.type === 'random_renew'" class="text-[9px] bg-purple-100 dark:bg-purple-500/20 text-purple-600 dark:text-purple-400 px-1.5 py-0.5 rounded-full font-bold">🎲</span>
                                                        </div>
                                                        <div class="text-[10px] font-bold text-slate-500 dark:text-zinc-400 mt-0.5 truncate" x-text="item.desc || '专属福利兑换'"></div>
                                                        <div x-show="item.type === 'random_renew'" class="text-[9px] text-purple-500 dark:text-purple-400 mt-1 font-medium">
                                                            <span x-text="'基础' + (item.base_days || 30) + '天 + 随机' + (item.random_min || -10) + '~' + (item.random_max || 60) + '天'"></span>
                                                        </div>
                                                        <div x-show="item.type === 'renew'" class="text-[9px] text-emerald-500 dark:text-emerald-400 mt-1 font-medium">
                                                            <span x-text="'续期 ' + (item.val || 30) + ' 天'"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button @click="redeemItem(item)" :disabled="isRedeeming || points < item.cost" class="shrink-0 px-4 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all active:scale-95 border disabled:opacity-50 disabled:active:scale-100 min-w-[90px]" :class="points >= item.cost ? (item.type === 'random_renew' ? 'bg-purple-50 text-purple-600 border-purple-200 hover:bg-purple-500 hover:text-white dark:bg-purple-500/10 dark:text-purple-400 dark:border-purple-500/20 dark:hover:bg-purple-500' : (item.type === 'renew' ? 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-500 hover:text-white dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20 dark:hover:bg-emerald-500' : 'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-500 hover:text-white dark:bg-amber-500/10 dark:text-amber-400 dark:border-amber-500/20 dark:hover:bg-amber-500')) : 'bg-slate-100 text-slate-400 border-slate-200 dark:bg-white/5 dark:border-white/5'">
                                                    <i x-show="isRedeeming" class="fa-solid fa-spinner fa-spin"></i>
                                                    <span x-show="!isRedeeming" x-text="item.cost + ' 积分'"></span>
                                                    <span x-show="isRedeeming">兑换中</span>
                                                </button>
                                            </div>
                                        </template>
                                        <div x-show="!(config?.store_items?.length)" class="text-center py-10 text-xs font-bold text-slate-400"><i class="fa-solid fa-box-open text-3xl opacity-20 mb-2 block"></i>店主正在进货中...</div>
                                    </div>

                                    <div x-show="showMyLogs" class="space-y-2" style="display: none;">
                                        <div class="flex justify-between items-center mb-3 px-1">
                                            <span class="text-xs font-bold text-slate-500"><i class="fa-regular fa-clock"></i> 积分明细 <span class="text-slate-400 font-normal" x-text="'(' + logsTotal + '条)'" ></span></span>
                                            <button @click="showMyLogs = false" class="text-xs text-brand-500 font-bold hover:underline"><i class="fa-solid fa-arrow-left"></i> 返回商城</button>
                                        </div>
                                        
                                        <!-- 加载中 -->
                                        <div x-show="logsLoading" class="text-center py-10 text-xs font-bold text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 block"></i>加载中...</div>
                                        
                                        <!-- 无数据 -->
                                        <div x-show="!logsLoading && myLogs.length === 0" class="text-center py-10 text-xs font-bold text-slate-400">暂无任何积分流水</div>
                                        
                                        <!-- 明细列表 -->
                                        <template x-for="log in myLogs" :key="log.created_at + log.amount">
                                            <div class="bg-white dark:bg-white/5 p-3.5 rounded-[16px] flex justify-between items-center shadow-sm border border-slate-100 dark:border-white/5">
                                                <div class="flex-1 pr-2">
                                                    <div class="text-xs font-bold text-slate-800 dark:text-zinc-200" x-text="log.action"></div>
                                                    <div class="text-[9px] text-slate-400 font-mono mt-1" x-text="log.created_at"></div>
                                                </div>
                                                <div class="text-right shrink-0">
                                                    <div class="text-sm font-black font-mono" :class="log.amount > 0 ? 'text-emerald-500' : 'text-rose-500'" x-text="(log.amount > 0 ? '+' : '') + log.amount"></div>
                                                    <div class="text-[9px] text-slate-400 font-mono" x-text="'余额: ' + log.balance"></div>
                                                </div>
                                            </div>
                                        </template>
                                        
                                        <!-- 分页控件 -->
                                        <div x-show="logsTotal > logsPageSize" class="flex justify-center items-center gap-2 mt-4 pt-3 border-t border-slate-200 dark:border-white/10">
                                            <button @click="logsFirstPage()" :disabled="logsPage === 1" class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold transition-colors" :class="logsPage === 1 ? 'text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10'"><i class="fa-solid fa-angles-left"></i></button>
                                            <button @click="logsPrevPage()" :disabled="logsPage === 1" class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold transition-colors" :class="logsPage === 1 ? 'text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10'"><i class="fa-solid fa-angle-left"></i></button>
                                            <span class="text-xs font-bold text-slate-600 dark:text-slate-300 px-2" x-text="logsPage + ' / ' + logsTotalPages"></span>
                                            <button @click="logsNextPage()" :disabled="logsPage >= logsTotalPages" class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold transition-colors" :class="logsPage >= logsTotalPages ? 'text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10'"><i class="fa-solid fa-angle-right"></i></button>
                                            <button @click="logsLastPage()" :disabled="logsPage >= logsTotalPages" class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold transition-colors" :class="logsPage >= logsTotalPages ? 'text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10'"><i class="fa-solid fa-angles-right"></i></button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- 兑换结果弹窗 -->
                    <template x-teleport="body">
                        <div x-show="redeemResult.show" class="fixed inset-0 z-[250] flex items-center justify-center p-4" x-cloak>
                            <div x-show="redeemResult.show" x-transition.opacity @click="redeemResult.show = false" class="absolute inset-0 bg-slate-900/70 dark:bg-black/90 backdrop-blur-sm"></div>

<!-- 🔥 我的追剧弹窗 -->

             class="relative w-full max-w-md bg-white dark:bg-[#111] border border-slate-200 dark:border-white/5 rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">

                    </h3>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">选择剧集请求更新缺失集数</p>
                </div>
                <button @click="mySeriesModalOpen = false; selectedSeries = null;" class="w-8 h-8 rounded-full bg-slate-200/50 dark:bg-white/10 text-slate-500 hover:text-rose-500 flex justify-center items-center transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            
            <!-- 内容区 - 修复滚动 -->
            <div class="flex-1 h-0 overflow-y-auto p-4 bg-slate-50 dark:bg-[#0a0a0a]">
                <!-- 加载中 -->
                <div x-show="mySeriesLoading" class="flex flex-col items-center justify-center py-12 gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-orange-500"></i>
                    <div class="text-sm text-slate-500">加载追剧列表...</div>
                </div>
                
                <!-- 空状态 -->
                <div x-show="!mySeriesLoading && mySeries.length === 0" class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-tv text-4xl mb-3 opacity-30"></i>
                    <p class="text-sm">暂无追剧记录</p>
                    <p class="text-xs mt-1 text-slate-400 dark:text-slate-500">观看剧集后这里会显示</p>
                </div>
                
                <!-- 剧集列表 -->
                <div x-show="!mySeriesLoading && mySeries.length > 0 && !selectedSeries" class="space-y-3">
                    <template x-for="series in mySeries" :key="series.series_id">
                        <div class="bg-white dark:bg-white/5 rounded-2xl p-4 border border-slate-100 dark:border-white/5 shadow-sm">
                            <div class="flex gap-3">
                                <img :src="series.poster || 'https://via.placeholder.com/100x150'" class="w-16 h-24 rounded-xl object-cover bg-slate-200 dark:bg-slate-700 shrink-0">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-slate-800 dark:text-white text-sm truncate" x-text="series.series_name"></h4>
                                    <div class="text-[10px] text-slate-500 mt-1">共 <span x-text="series.total_seasons"></span> 季</div>
                                    
                                    <!-- 季信息 -->
                                    <div class="mt-2 space-y-1">
                                        <template x-for="s in series.seasons" :key="s.season">
                                            <div class="flex items-center justify-between text-[11px]">
                                                <span class="text-slate-600 dark:text-slate-400">第 <span x-text="s.season"></span> 季</span>
                                                <div class="flex items-center gap-2">
                                                    <span class="text-slate-400" x-text="s.local_count + '/' + s.tmdb_total + ' 集'"></span>
                                                    <span x-show="s.missing_eps && s.missing_eps.length > 0" class="text-orange-500 font-bold">
                                                        缺 <span x-text="s.missing_eps.length"></span> 集
                                                    </span>
                                                    <span x-show="!s.missing_eps || s.missing_eps.length === 0" class="text-emerald-500">
                                                        ✓ 完整
                                                    </span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 操作按钮 -->
                            <div x-show="series.seasons && series.seasons.some(s => s.missing_eps && s.missing_eps.length > 0)" class="mt-3 pt-3 border-t border-slate-100 dark:border-white/5">
                                <button @click="selectSeriesForUpdate(series)" class="w-full py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> 请求追新
                                </button>
                            </div>
                            
                            <!-- 追新状态显示 -->
                            <template x-for="s in series.seasons" :key="'status-'+s.season">
                                <div x-show="s.request_status" class="mt-2 text-[10px]">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-slate-500">追新状态:</span>
                                        <span class="px-1.5 py-0.5 rounded-full font-bold" 
                                              :class="getRequestStatusClass(s.request_status?.status)">
                                            <span x-text="getRequestStatusText(s.request_status?.status)"></span>
                                            <span x-show="s.request_status?.episodes" x-text="'(E' + (s.request_status?.episodes || '').replace(',', '-') + ')'"></span>
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                
                <!-- 选择集数 -->
                <div x-show="selectedSeries" class="space-y-3">
                    <button @click="selectedSeries = null; selectedEpisodes = [];" class="text-xs text-slate-500 hover:text-brand-500 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> 返回列表
                    </button>
                    
                    <div class="bg-white dark:bg-white/5 rounded-2xl p-4 border border-slate-100 dark:border-white/5">
                        <h4 class="font-bold text-slate-800 dark:text-white text-sm" x-text="selectedSeries?.series_name"></h4>
                        <div class="text-[11px] text-slate-500 mt-1" x-show="selectedSeries?.seasons?.[0]">
                            第 <span x-text="selectedSeries?.seasons?.[0]?.season"></span> 季 · 
                            已有 <span x-text="selectedSeries?.seasons?.[0]?.local_count"></span> 集 · 
                            共 <span x-text="selectedSeries?.seasons?.[0]?.tmdb_total"></span> 集
                        </div>
                        
                        <!-- 集数选择 -->
                        <div class="mt-3">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[11px] font-bold text-slate-600 dark:text-slate-400">选择要追新的集数：</span>
                                <div class="flex gap-2">
                                    <button @click="clearAllEpisodes()" class="text-[10px] text-slate-400 hover:text-slate-600 font-bold">
                                        清空
                                    </button>
                                    <button @click="selectAllMissingEpisodes()" class="text-[10px] text-brand-500 hover:text-brand-600 font-bold">
                                        <span x-text="selectedEpisodes.length === (selectedSeries?.seasons?.[0]?.missing_eps?.length || 0) ? '取消全选' : '全选缺失'"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1.5" x-show="selectedSeries?.seasons?.[0]?.missing_eps">
                                <template x-for="ep in (selectedSeries?.seasons?.[0]?.missing_eps || [])" :key="ep">
                                    <div class="relative inline-block">
                                        <button @click="toggleEpisodeSelection(ep)" 
                                                class="w-10 h-10 rounded-lg text-xs font-bold transition-all"
                                                :class="selectedEpisodes.includes(ep) ? 'bg-orange-500 text-white shadow-md' : 'bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-400 hover:bg-orange-100 dark:hover:bg-orange-500/20'">
                                            E<span x-text="ep"></span>
                                        </button>
                                        <!-- 🔥 未播出标记 -->
                                        <span x-show="selectedSeries?.seasons?.[0]?.unaired_eps?.includes(ep)" 
                                              class="absolute -top-1 -right-1 text-[8px] font-bold text-rose-500 bg-rose-100 dark:bg-rose-500/20 px-1 rounded-full whitespace-nowrap">
                                            未播
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 🔥 积分消耗提示 -->
                    <div x-show="updateCostInfo.enabled" class="mt-2 mb-3 text-center text-xs font-bold">
                        <span class="inline-flex items-center gap-1 px-2 py-1 bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400 rounded-lg">
                            <i class="fa-solid fa-coins"></i> 本次追新将消耗 <span x-text="updateCostInfo.cost"></span> 积分
                        </span>
                    </div>
                    
                    <!-- 提交按钮 -->
                    <button @click="submitUpdateRequest()" 
                            :disabled="selectedEpisodes.length === 0 || submittingUpdate"
                            class="w-full py-3 bg-orange-500 hover:bg-orange-600 disabled:bg-slate-300 dark:disabled:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                        <i x-show="!submittingUpdate" class="fa-solid fa-paper-plane"></i>
                        <i x-show="submittingUpdate" class="fa-solid fa-spinner fa-spin"></i>
                        <span x-text="submittingUpdate ? '提交中...' : '提交追新请求 (E' + selectedEpisodes.join('-') + ')'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

                    <div x-show="guessHint" class="mb-3 p-3 rounded-xl" :class="guessHint.includes('大了') ? 'bg-red-100 dark:bg-red-500/20' : 'bg-blue-100 dark:bg-blue-500/20'">
                        <p class="font-bold" :class="guessHint.includes('大了') ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'" x-text="guessHint"></p>
                    </div>
                    
                    <input type="number" x-model="guessInput" @keyup.enter="submitGuess()" :disabled="guessSubmitting"
                           class="w-full px-4 py-3 text-center text-2xl font-black bg-white dark:bg-white/10 border-2 border-indigo-300 dark:border-indigo-500/50 rounded-xl outline-none focus:border-indigo-500"
                           :placeholder="guessRange">
                    
                    <button @click="submitGuess()" :disabled="guessSubmitting || !guessInput"
                            class="mt-3 w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 disabled:from-gray-300 dark:disabled:from-gray-600 disabled:to-gray-400 dark:disabled:to-gray-700 text-white font-black rounded-2xl shadow-lg transition-all active:scale-95 disabled:cursor-not-allowed">
                        <span x-show="!guessSubmitting">确认猜测</span>
                        <span x-show="guessSubmitting" class="flex items-center justify-center gap-2">
                            <i class="fa-solid fa-spinner fa-spin"></i> 判断中...
                        </span>
                    </button>
                </div>
                
                <!-- 游戏结果 -->
                <div x-show="guessResult" class="text-center py-4">
                    <div class="text-5xl mb-3" x-text="guessWon ? '🎉' : '😢'"></div>
                    <p class="font-bold text-lg" :class="guessWon ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'" x-text="guessResult"></p>
                    <p x-show="guessWon" class="text-sm text-yellow-600 dark:text-yellow-400 mt-2">+<span x-text="guessReward"></span> 积分</p>
                    <button @click="resetGuessGame()" class="mt-4 px-8 py-2 bg-gray-200 dark:bg-white/10 hover:bg-gray-300 dark:hover:bg-white/20 text-gray-700 dark:text-gray-300 font-bold rounded-xl transition-all">
                        再玩一次
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>
